<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Review</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light;--bg:#fbfaf7;--fg:#1c1b19;--muted:#6b675f;--line:#e4e0d8;--card:#fcfcfb;--accent:#9a3412;--chip:#f1eee7;--hover:#f5f2ec;
  --sel:#fdf1e7;--bad:#b42318;--badbg:#fdecea;--ok:#006300;--okbg:#e8f5e8;--pD:#2a78d6;--pR:#e34948;--pI:#a86f00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141413;--fg:#ecebe6;--muted:#a19d94;--line:#2c2b28;--card:#1a1a19;--accent:#f0894a;--chip:#252421;--hover:#20201d;
  --sel:#2a1d14;--bad:#f97066;--badbg:#3a1a17;--ok:#0ca30c;--okbg:#14261a;--pD:#3987e5;--pR:#e66767;--pI:#eda100}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:16px;margin:0 8px 0 0}
.prog{flex:1;min-width:160px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
select,input,button,textarea{font:inherit;font-size:13px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{background:var(--hover)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 54px)}
@media (max-width:820px){.wrap{grid-template-columns:1fr;height:auto}.list{max-height:240px}}
.list{overflow-y:auto;border-right:1px solid var(--line)}
.li{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px}
.li:hover{background:var(--hover)}.li.on{background:var(--sel)}
.li .st{width:18px;text-align:center;font-weight:700}
.li .sub{color:var(--muted);font-size:12px}
.main{overflow-y:auto;padding:18px 22px 60px}
.pD{color:var(--pD)}.pR{color:var(--pR)}.pI{color:var(--pI)}
h2{margin:0;font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:12px;border-radius:99px;padding:1px 9px;background:var(--chip);color:var(--muted)}
.tag.hot{background:var(--badbg);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.box b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.box .v{font-size:20px;font-weight:600}
.panel{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);margin:12px 0}
.panel h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.decide{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
@media (min-height:820px){.decide{position:sticky;bottom:0}}
.decide .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.decide textarea{width:100%;margin-top:8px;min-height:44px}
.q{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:10px 0}
.q.cited{border-left-color:var(--ok)}.q.bad{border-left-color:var(--bad);background:var(--badbg)}
.q .src{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;background:var(--chip);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--muted)}
.kbd{font-size:11px;color:var(--muted)}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.note{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Score review</h1>
  <select id="fcat" aria-label="Queue"></select>
  <select id="fdim" aria-label="Question"><option value="">All questions</option></select>
  <select id="fdone" aria-label="Status"><option value="">All</option><option value="todo">To do</option><option value="done">Done</option></select>
  <div class="prog" title="progress"><i id="bar"></i></div><span id="pct" class="note"></span>
  <button id="export">Export decisions</button>
  <label class="note" style="cursor:pointer">Import<input type="file" id="import" accept=".json" hidden></label>
</header>
<div class="wrap">
  <nav class="list" id="list" aria-label="Review queue"></nav>
  <main class="main" id="main"></main>
</div>
<script>
const DIM = {ai_overall:"AI overall", agi_pilled:"AGI-pilled", x_risk:"AI x-risk", china_race:"China race", regulation:"Regulation"};
const LEVELS = {
  ai_overall:["Mainly a threat","Harms dominate","Balanced","Mainly an opportunity","Enthusiastic"],
  agi_pilled:["Doesn't discuss or dismisses","Ordinary technology","Very large change","AGI is possible","AGI is near"],
  x_risk:["Doesn't discuss or dismisses","Raises it, plays it down","A real risk","Wants action on it","A top priority"],
  china_race:["Doesn't raise it or rejects it","Mentions it","One reason among several","The main reason","Outweighs everything"],
  regulation:["Opposes rules","Light-touch","Targeted rules","Substantial rules","Comprehensive rules"],
};
const CAT = {no_support:"No cited quote supports the score", disagree:"Second model disagrees", runs_split:"The two models are 2+ apart", blind_gap:"Blind re-score differs by 2+", packet:"Top scorers & random sample"};
const KEY = "wwsai-review-v1";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => typeof v==="number" ? (Math.round(v*10)/10).toString() : v==null ? "—" : "not enough";
let ITEMS=[], view=[], cur=0, D={}, quotes={}, qsearch="";
const ik = it => `${it.id}|${it.dim}`;
function load(){ try{ D = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ D={}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} }

async function init(){
  load();
  ITEMS = await fetch("data/review.json").then(r=>r.json());
  const counts = {}; ITEMS.forEach(it=>it.cats.forEach(c=>counts[c]=(counts[c]||0)+1));
  fcat.innerHTML = `<option value="">Everything (${ITEMS.length})</option>` + Object.keys(CAT).filter(c=>counts[c]).map(c=>`<option value="${c}">${CAT[c]} (${counts[c]})</option>`).join("");
  fdim.innerHTML += Object.entries(DIM).map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  for (const e of [fcat,fdim,fdone]) e.onchange=()=>{cur=0; filter();};
  document.getElementById("export").onclick = exportD;
  document.getElementById("import").onchange = importD;
  addEventListener("keydown", onKey);
  filter();
}
function filter(){
  view = ITEMS.filter(it=>(!fcat.value||it.cats.includes(fcat.value)) && (!fdim.value||it.dim===fdim.value)
    && (!fdone.value || (fdone.value==="done") === !!D[ik(it)]));
  cur = Math.min(cur, Math.max(0, view.length-1));
  renderList(); render();
}
function decisionLabel(d, it){ if(!d) return ""; if(d.verdict==="agree") return "✓"; return d.score==="insufficient_evidence" ? "–" : String(d.score); }
function renderList(){
  const done = ITEMS.filter(it=>D[ik(it)]).length;
  bar.style.width = (done/ITEMS.length*100)+"%"; pct.textContent = `${done} / ${ITEMS.length} reviewed`;
  list.innerHTML = view.map((it,i)=>`<div class="li ${i===cur?"on":""}" data-i="${i}"><span class="st">${decisionLabel(D[ik(it)],it)}</span>
    <div><div><span class="p${it.party}">●</span> ${esc(it.name)}</div><div class="sub">${DIM[it.dim]} · ${fmt(it.score)}${it.cats[0]!=="packet"?` · <span style="color:var(--bad)">${esc(CAT[it.cats[0]])}</span>`:""}</div></div></div>`).join("") || '<p class="note" style="padding:12px">Nothing in this view.</p>';
  list.querySelectorAll(".li").forEach(e=>e.onclick=()=>{cur=+e.dataset.i; renderList(); render();});
  list.querySelector(".li.on")?.scrollIntoView({block:"nearest"});
}
async function render(){
  const it = view[cur]; if(!it){ main.innerHTML='<p class="note">Nothing to review in this view.</p>'; return; }
  if (!quotes[it.id]) quotes[it.id] = await fetch(`data/quotes/${it.id}.json`).then(r=>r.json());
  if (view[cur]!==it) return;
  const Q = quotes[it.id].quotes, bad = new Set(it.audit?.bad||[]), cited = new Set(it.cited);
  const d = D[ik(it)] || {};
  const lvl = v => typeof v==="number" ? `${fmt(v)} · ${LEVELS[it.dim][Math.floor(v+0.5)]}` : v==="insufficient_evidence"||v==null ? "Not enough evidence" : v;
  const qHTML = q => `<div class="q ${bad.has(q.sid)?"bad":cited.has(q.sid)?"cited":""}">“${esc(q.text)}”<div class="src">${q.sid} · ${esc(q.src)} · ${esc(q.date||"undated")} · <a href="${esc(q.url)}" target="_blank" rel="noopener">source</a>
    ${bad.has(q.sid)?' · <b style="color:var(--bad)">auditor: doesn\'t support the score</b>':cited.has(q.sid)?' · <b style="color:var(--ok)">cited</b>':""} ${q.lab&&q.lab[it.dim]?`<b>· labels for this question: Claude ${q.lab[it.dim][0]??"–"} / GPT ${q.lab[it.dim][1]??"–"}</b>`:""} ${q.topics.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>`;
  const citedQ = it.cited.map(s=>Q.find(q=>q.sid===s)).filter(Boolean);
  const labeled = q => q.lab && q.lab[it.dim] ? 1 : 0;
  const others = Q.filter(q=>!cited.has(q.sid) && (!qsearch || q.text.toLowerCase().includes(qsearch.toLowerCase()))).sort((a,b)=>labeled(b)-labeled(a));
  main.innerHTML = `
    <h2><span class="p${it.party}">${esc(it.name)}</span> <span class="note" style="font-size:14px">${it.party}-${it.state} · ${it.chamber}${it.status==="member_elect"?" · new member":""}</span></h2>
    <div class="tags"><span class="tag">${DIM[it.dim]}</span>${it.cats.map(c=>`<span class="tag ${c==="packet"?"":"hot"}">${esc(CAT[c])}${c==="packet"&&it.why?": "+esc(it.why):""}</span>`).join("")}<span class="note">Item ${cur+1} of ${view.length}</span></div>
    <div class="grid">
      <div class="box"><b>Score shown on site</b><div class="v">${esc(lvl(it.score))}</div></div>
      <div class="box"><b>Claude / GPT</b><div class="v">${fmt(it.run_a)} / ${fmt(it.run_b)}</div></div>
      <div class="box"><b>Second model, blind</b><div class="v">${esc(lvl(it.blind))}</div></div>
      ${it.audit?`<div class="box"><b>Second model, audit</b><div class="v">${esc(it.audit.verdict||"—")}${it.audit.verdict==="disagree"?` → ${esc(fmt(it.audit.score))}`:""}</div></div>`:""}
    </div>
    ${it.audit?.note?`<div class="panel"><h3>Auditor's note</h3>${esc(it.audit.note)}</div>`:""}
    <div class="panel"><h3>Why the model gave this score</h3>${esc(it.justification||"—")}</div>
    <div class="panel"><h3>Cited quotes (${citedQ.length})</h3>${citedQ.map(qHTML).join("")||'<p class="note">None cited.</p>'}</div>
    <div class="panel"><h3>All other statements (${Q.length-citedQ.length}), ones labeled for this question first</h3>
      <input id="qs" type="search" placeholder="Search these statements…" value="${esc(qsearch)}" style="width:100%">
      <div id="others">${others.slice(0,80).map(qHTML).join("")}${others.length>80?`<p class="note">…${others.length-80} more; search to narrow.</p>`:""}</div></div>
    <div class="panel"><h3>Summary of this person</h3>${esc(it.summary)}</div>
    <div class="decide">
      <div class="row"><strong style="margin-right:6px">Your call:</strong>
        <button data-v="agree" aria-pressed="${d.verdict==="agree"}">Agree <span class="kbd"><kbd>A</kbd></span></button>
        ${[0,1,2,3,4].map(v=>`<button data-v="${v}" aria-pressed="${d.verdict==="change"&&d.score===v}" title="${esc(LEVELS[it.dim][v])}">${v} ${esc(LEVELS[it.dim][v])} <span class="kbd"><kbd>${v}</kbd></span></button>`).join("")}
        <button data-v="insufficient_evidence" aria-pressed="${d.verdict==="change"&&d.score==="insufficient_evidence"}">Not enough evidence <span class="kbd"><kbd>I</kbd></span></button>
        ${D[ik(it)]?`<button data-v="clear">Clear</button>`:""}
      </div>
      <textarea id="note" placeholder="Note (optional). Press N to focus, Esc to leave.">${esc(d.note||"")}</textarea>
      <div class="kbd" style="margin-top:4px"><kbd>J</kbd>/<kbd>→</kbd> next · <kbd>K</kbd>/<kbd>←</kbd> previous · deciding moves you to the next item</div>
    </div>`;
  main.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>decide(b.dataset.v));
  const qs = document.getElementById("qs"); qs.oninput=()=>{ qsearch=qs.value; const o=Q.filter(q=>!cited.has(q.sid)&&(!qsearch||q.text.toLowerCase().includes(qsearch.toLowerCase()))).sort((a,b)=>labeled(b)-labeled(a)); document.getElementById("others").innerHTML=o.slice(0,80).map(qHTML).join(""); };
  const note = document.getElementById("note"); note.oninput=()=>{ const k=ik(it); if(D[k]){ D[k].note=note.value; save(); } else if(note.value){ D[k]={verdict:"note", note:note.value, at:new Date().toISOString()}; save(); renderList(); } };
}
function decide(v){
  const it = view[cur]; const k = ik(it), note = document.getElementById("note")?.value || "";
  if (v==="clear") delete D[k];
  else D[k] = {verdict: v==="agree"?"agree":"change", score: v==="agree"?it.score : v==="insufficient_evidence"?v:+v, note, at:new Date().toISOString()};
  save();
  if (v!=="clear" && cur < view.length-1){ cur++; qsearch=""; }
  if (fdone.value) filter(); else { renderList(); render(); }
  main.scrollTop = 0;
}
function onKey(e){
  if (e.target.matches("textarea,input")){ if(e.key==="Escape") e.target.blur(); return; }
  const k = e.key.toLowerCase();
  if (k==="j"||e.key==="ArrowRight"){ if(cur<view.length-1){cur++; qsearch=""; renderList(); render(); main.scrollTop=0;} }
  else if (k==="k"||e.key==="ArrowLeft"){ if(cur>0){cur--; qsearch=""; renderList(); render(); main.scrollTop=0;} }
  else if (k==="a") decide("agree");
  else if (k==="i") decide("insufficient_evidence");
  else if ("01234".includes(k) && k.length===1) decide(k);
  else if (k==="n"){ e.preventDefault(); document.getElementById("note")?.focus(); }
  else return;
  e.preventDefault();
}
function exportD(){
  const out = ITEMS.filter(it=>D[ik(it)]).map(it=>({id:it.id, name:it.name, dimension:it.dim, model_score:it.score, ...D[ik(it)]}));
  const blob = new Blob([JSON.stringify({exported:new Date().toISOString(), decisions:out}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "review_decisions.json"; a.click();
}
async function importD(e){
  const f = e.target.files[0]; if(!f) return;
  try{ const j = JSON.parse(await f.text()); for (const d of j.decisions||[]){ const {id,dimension,name,model_score,...rest}=d; D[`${id}|${dimension}`]=rest; } save(); filter(); }
  catch(err){ console.log("import failed", err); }
}
init();
</script>
</body>
</html>
