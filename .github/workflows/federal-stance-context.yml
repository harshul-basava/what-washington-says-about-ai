name: Federal stance source context
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  context:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev --frozen
      - name: Read only the posts flagged by Astra
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: uv run --no-dev python federal_stance_review.py x-context
      - name: Save public source context and cost records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federal-stance-context
          path: data/raw/federal_stance_context/
          retention-days: 7
