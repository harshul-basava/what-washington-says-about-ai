# Daily update: collect federal statements; update policy positions, five scores,
# regulation categories, summaries, topics, and histories; then update Congress and publish.
# Vercel redeploys on the push when the project permits deployment.
# Forks default to federal-only updates. Explicit sources override this default.
# Federal secrets: OPENROUTER_API_KEY, X_BEARER_TOKEN. Congress also needs GOVINFO_API_KEY.
name: Daily update

on:
  schedule:
    - cron: "0 11 * * *"   # about 6-7am US Eastern
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources (x,crec,chrg,web,federal; empty = federal on forks, all on upstream)"
        required: false
      since:
        description: "Override start date YYYY-MM-DD (empty = since last run)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IN_SOURCES: ${{ inputs.sources || (github.event.repository.fork && 'federal') || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Include data and costs saved by a manual X batch while this run was queued.
          ref: ${{ github.event.repository.default_branch }}

      - name: Check secrets
        id: keys
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set; skipping the daily update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.keys.outputs.skip != 'true'

      - name: Install
        if: steps.keys.outputs.skip != 'true'
        run: uv sync --no-dev --frozen

      - name: Restore earlier archive snapshots
        uses: actions/cache/restore@v4
        if: steps.keys.outputs.skip != 'true'
        with:
          path: |
            data/raw/federal_archives
            data/raw/federal_stance_context
          key: federal-legacy-daily-${{ github.run_id }}
          restore-keys: |
            federal-archive-daily-v1-
            federal-archives-v1-

      - uses: actions/cache/restore@v4
        id: archives
        if: steps.keys.outputs.skip != 'true'
        with:
          path: |
            data/raw/federal_archives
            data/raw/federal_stance_context
            data/raw/federal_search
            data/raw/federal_x_api
          key: federal-shared-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            federal-shared-v2-

      - name: Refresh reference files (legislators, committees)
        if: steps.keys.outputs.skip != 'true' && env.IN_SOURCES != 'federal'
        run: |
          for f in legislators-current.json committee-membership-current.json; do
            curl -fsSL "https://unitedstates.github.io/congress-legislators/$f" -o "data/ref/$f.new" && mv "data/ref/$f.new" "data/ref/$f" || echo "kept old $f"
          done

      - name: Run daily update
        if: steps.keys.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          IN_SINCE: ${{ inputs.since }}
        run: |
          args=()
          [[ "$IN_SOURCES" =~ ^[a-z,]+$ ]] && args+=(--sources "$IN_SOURCES")
          [[ "$IN_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && args+=(--since "$IN_SINCE")
          uv run --no-dev python scripts/daily/run.py "${args[@]}"

      - name: Check due federal leadership directories
        if: always() && steps.keys.outputs.skip != 'true'
        timeout-minutes: 5
        run: uv run --no-dev python federal_roster.py check --max-pages 40

      - uses: actions/cache/save@v4
        if: always() && steps.keys.outputs.skip != 'true'
        with:
          path: |
            data/raw/federal_archives
            data/raw/federal_stance_context
            data/raw/federal_search
            data/raw/federal_x_api
          key: ${{ steps.archives.outputs.cache-primary-key }}

      - name: Report federal update status
        if: always() && steps.keys.outputs.skip != 'true'
        run: |
          if [ -f data/federal_status.json ]; then
            echo '### Federal update status (check the report date)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/federal_status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve results before publishing
        if: always() && steps.keys.outputs.skip != 'true'
        run: |
          git add data evidence site/data
          git diff --cached --binary > "$RUNNER_TEMP/daily-update.patch"

      - uses: actions/upload-artifact@v4
        if: always() && steps.keys.outputs.skip != 'true'
        with:
          name: daily-update-recovery
          path: |
            ${{ runner.temp }}/daily-update.patch
            data/cost_ledger.jsonl
          retention-days: 7

      - name: Commit and push (also after a failed step, so collected statements and spend are kept)
        if: always() && steps.keys.outputs.skip != 'true'
        run: |
          git config user.name "dc-on-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data evidence site/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Daily update $(date -u +%F)"
          git push

      - name: Open an issue for big score changes
        if: steps.keys.outputs.skip != 'true' && env.IN_SOURCES != 'federal' && hashFiles('data/issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # opened for the record and the notification, then closed right away: nothing needs manual action
          url=$(gh issue create --title "Score changes $(date -u +%F)" --body-file data/issue.md)
          gh issue close "$url" --reason completed --comment "Closed automatically. Reopen if a change needs a human check."
