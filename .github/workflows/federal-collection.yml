name: Efficient federal collection
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Trial must pass before expansion; both share the fixed campaign budget"
        type: choice
        options: [trial, expand]
        default: trial
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev --frozen
      - name: Restore earlier archive snapshots
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/federal_archives
            data/raw/federal_stance_context
          key: federal-legacy-import-${{ github.run_id }}
          restore-keys: |
            federal-archives-v1-
            federal-archive-daily-v1-
      - name: Restore shared collection caches
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            data/raw/federal_archives
            data/raw/federal_stance_context
            data/raw/federal_search
            data/raw/federal_x_api
          key: federal-shared-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            federal-shared-v2-
      - name: Verify existing archive pilot without model calls
        run: |
          if [ ! -f data/federal_collection_campaign.json ]; then
            uv run --no-dev python scripts/federal_archives.py check-cache
          fi
      - name: Collect and review with cumulative reservations
        id: execute
        continue-on-error: true
        timeout-minutes: 150
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PHASE: ${{ inputs.phase }}
        run: uv run --no-dev python scripts/federal_collection_campaign.py run --phase "$PHASE"
      - name: Verify new source snapshots
        if: steps.execute.outcome == 'success'
        run: uv run --no-dev python scripts/federal_collection_campaign.py verify
      - name: Build saved evidence and judgments
        if: always()
        run: uv run --no-dev python scripts/phase5_build_site.py --record-federal-history
      - name: Save public progress and cost records
        if: always()
        run: |
          git config user.name "dc-on-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data evidence site/data
          git diff --cached --binary > "$RUNNER_TEMP/federal-collection.patch"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save efficient federal collection evidence and judgments"
          git push
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/federal_archives
            data/raw/federal_stance_context
            data/raw/federal_search
            data/raw/federal_x_api
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: federal-collection-progress
          path: |
            ${{ runner.temp }}/federal-collection.patch
            data/federal_collection_campaign.json
            data/federal_collection_verification.json
          retention-days: 14
      - name: Report execution result
        if: always()
        env:
          OUTCOME: ${{ steps.execute.outcome }}
        run: test "$OUTCOME" = success
